  OrchestraActionStepV10:
    name: OrchestraActionStepV10
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraActionStepV10
    annotations:
      xsd_type:
        tag: xsd_type
        value: choice of messageRef, assign, trigger, timerSchedule
      xml_namespace:
        tag: xml_namespace
        value: http://fixprotocol.io/2020/orchestra/repository
    description: 'One thing an action does: send a message, set a value, fire a transition
      or schedule a timer. It holds exactly one of these.'
    title: Orchestra action step (1.0)
    in_subset:
    - fixr
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_0
    slots:
    - orchestraActionStepV10__fixr_message_ref
    - orchestraActionStepV10__fixr_assign
    - orchestraActionStepV10__fixr_trigger
    - orchestraActionStepV10__fixr_timer_schedule
    attributes:
      fixr_message_ref:
        name: fixr_message_ref
        annotations:
          xml_element:
            tag: xml_element
            value: messageRef
        description: A message to send.
        range: OrchestraMessageRefV10
        inlined: true
      fixr_assign:
        name: fixr_assign
        annotations:
          xml_element:
            tag: xml_element
            value: assign
        description: An expression that gives an actor's variable a value, such as
          $actor.variable=value.
        range: string
        pattern: ^[\s\S]{0,1024}$
      fixr_trigger:
        name: fixr_trigger
        annotations:
          xml_element:
            tag: xml_element
            value: trigger
        description: A transition to fire.
        range: OrchestraTriggerV10
        inlined: true
      fixr_timer_schedule:
        name: fixr_timer_schedule
        annotations:
          xml_element:
            tag: xml_element
            value: timerSchedule
        description: A timer to start, stop or restart.
        range: OrchestraTimerScheduleV10
        inlined: true
    class_uri: fix_orchestra:OrchestraActionStepV10
    exactly_one_of:
    - slot_conditions:
        fixr_message_ref:
          name: fixr_message_ref
          required: true
    - slot_conditions:
        fixr_assign:
          name: fixr_assign
          required: true
    - slot_conditions:
        fixr_trigger:
          name: fixr_trigger
          required: true
    - slot_conditions:
        fixr_timer_schedule:
          name: fixr_timer_schedule
          required: true
  OrchestraActionV10:
    name: OrchestraActionV10
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraActionV10
    annotations:
      xsd_type:
        tag: xsd_type
        value: actionType
      xml_namespace:
        tag: xml_namespace
        value: http://fixprotocol.io/2020/orchestra/repository
    description: 'Things that happen together, such as when a response fires or a
      state is entered: messages sent, values set, transitions fired and timers scheduled,
      with their inputs.'
    title: Orchestra action (1.0)
    in_subset:
    - fixr
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_0
    slots:
    - orchestraActionV10__fixr_parameters
    - orchestraActionV10__fixr_actions
    attributes:
      fixr_parameters:
        name: fixr_parameters
        annotations:
          xml_choice:
            tag: xml_choice
            value: field fieldRef component componentRef group groupRef
        description: The fields, groups and components the action takes as input,
          in order.
        range: OrchestraActionParameterV10
        multivalued: true
        inlined_as_list: true
      fixr_actions:
        name: fixr_actions
        annotations:
          xml_choice:
            tag: xml_choice
            value: messageRef assign trigger timerSchedule
        description: 'What the action does, in order: messages sent, values set, transitions
          fired and timers scheduled.'
        range: OrchestraActionStepV10
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: fix_orchestra:OrchestraActionV10
  OrchestraActorMemberV10:
