  OrchestraXmlElement:
    name: OrchestraXmlElement
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraXmlElement
    description: An XML element in a place where the XSDs accept any content, kept
      as written so that the file converts back unchanged.
    title: Open XML element
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    slots:
    - orchestraXmlElement__xml_name
    - orchestraXmlElement__xml_attributes
    - orchestraXmlElement__xml_text
    - orchestraXmlElement__xml_children
    - orchestraXmlElement__xml_tail
    attributes:
      xml_name:
        name: xml_name
        description: The name, with its namespace in braces when it has one.
        required: true
        pattern: ^(\{[^}]*\})?[^\s{}]+$
      xml_attributes:
        name: xml_attributes
        description: The element's attributes.
        range: OrchestraXmlAttribute
        multivalued: true
        inlined_as_list: true
      xml_text:
        name: xml_text
        description: The text before the first child element.
      xml_children:
        name: xml_children
        description: The child elements, in order.
        range: OrchestraXmlElement
        multivalued: true
        inlined_as_list: true
      xml_tail:
        name: xml_tail
        description: The text after the element and before its next sibling.
    class_uri: fix_orchestra:OrchestraXmlElement
  OrchestraXmlAttribute:
    name: OrchestraXmlAttribute
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraXmlAttribute
    description: An XML attribute from another namespace, kept as written.
    title: Open XML attribute
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    slots:
    - orchestraXmlAttribute__xml_name
    - orchestraXmlAttribute__xml_value
    attributes:
      xml_name:
        name: xml_name
        description: The name, with its namespace in braces when it has one.
        required: true
        pattern: ^(\{[^}]*\})?[^\s{}]+$
      xml_value:
        name: xml_value
        description: The attribute's value.
        required: true
    class_uri: fix_orchestra:OrchestraXmlAttribute
  OrchestraActionParameterV10:
    name: OrchestraActionParameterV10
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraActionParameterV10
    annotations:
      xsd_type:
        tag: xsd_type
        value: choice of field, fieldRef, component, componentRef, group, groupRef
      xml_namespace:
        tag: xml_namespace
        value: http://fixprotocol.io/2020/orchestra/repository
    description: One input to an action, which is a field, component or group, defined
      in place or named by reference. It holds exactly one of these.
    title: Orchestra action input (1.0)
    in_subset:
    - fixr
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_0
    slots:
    - orchestraActionParameterV10__fixr_field
    - orchestraActionParameterV10__fixr_field_ref
    - orchestraActionParameterV10__fixr_component
    - orchestraActionParameterV10__fixr_component_ref
    - orchestraActionParameterV10__fixr_group
    - orchestraActionParameterV10__fixr_group_ref
    attributes:
      fixr_field:
        name: fixr_field
        annotations:
          xml_element:
            tag: xml_element
            value: field
        description: A field defined in place.
        range: OrchestraFieldV10
        inlined: true
      fixr_field_ref:
        name: fixr_field_ref
        annotations:
          xml_element:
            tag: xml_element
            value: fieldRef
        description: A field used by reference.
        range: OrchestraFieldRefV10
        inlined: true
      fixr_component:
        name: fixr_component
        annotations:
          xml_element:
            tag: xml_element
            value: component
        description: A component defined in place.
        range: OrchestraComponentV10
        inlined: true
      fixr_component_ref:
        name: fixr_component_ref
        annotations:
          xml_element:
            tag: xml_element
            value: componentRef
        description: A component used by reference.
        range: OrchestraComponentRefV10
        inlined: true
      fixr_group:
        name: fixr_group
        annotations:
          xml_element:
            tag: xml_element
            value: group
        description: A repeating group defined in place.
        range: OrchestraGroupV10
        inlined: true
      fixr_group_ref:
        name: fixr_group_ref
        annotations:
          xml_element:
            tag: xml_element
            value: groupRef
        description: A group used by reference.
        range: OrchestraGroupRefV10
        inlined: true
    class_uri: fix_orchestra:OrchestraActionParameterV10
    exactly_one_of:
    - slot_conditions:
        fixr_field:
          name: fixr_field
          required: true
    - slot_conditions:
        fixr_field_ref:
          name: fixr_field_ref
          required: true
    - slot_conditions:
        fixr_component:
          name: fixr_component
          required: true
    - slot_conditions:
        fixr_component_ref:
          name: fixr_component_ref
          required: true
    - slot_conditions:
