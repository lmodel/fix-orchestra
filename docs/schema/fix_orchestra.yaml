name: fix_orchestra
annotations:
  edition_1.0:
    tag: edition_1.0
    value: fix-orchestra-spec v1.0 e2b65db8505244f2708c468fe7cad60855fa9834
  edition_1.1-rc3:
    tag: edition_1.1-rc3
    value: fix-orchestra v1.1-rc3 eb4bb9de3bd8802c6e5e0aba06182407b22acc9b
description: A LinkML model of FIX Orchestra, the FIX Trading Community's standard
  for rules of engagement that a machine can read. It renders two editions from their
  XSDs, the v1.0 Technical Standard and the v1.1 third release candidate, so that
  an Orchestra repository or interfaces file of either edition converts to records
  that validate here.
title: FIX Orchestra
source: https://github.com/FIXTradingCommunity/fix-orchestra-spec
see_also:
- https://lmodel.github.io/fix-orchestra
- https://github.com/FIXTradingCommunity/fix-orchestra-spec
id: https://w3id.org/lmodel/fix-orchestra
version: 1.0, 1.1-rc3
imports:
- linkml:types
- ./fix_orchestra_common
- ./fix_orchestra_v1_0
- ./fix_orchestra_v1_1
license: Apache-2.0
prefixes:
  fix_orchestra:
    prefix_prefix: fix_orchestra
    prefix_reference: https://w3id.org/lmodel/fix-orchestra/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  dc:
    prefix_prefix: dc
    prefix_reference: http://purl.org/dc/elements/1.1/
  dcterms:
    prefix_prefix: dcterms
    prefix_reference: http://purl.org/dc/terms/
default_prefix: fix_orchestra
default_range: string
subsets:
  fixr:
    name: fixr
    definition_uri: https://w3id.org/lmodel/fix-orchestra/Fixr
    description: Elements that a repository holds.
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
  fixi:
    name: fixi
    definition_uri: https://w3id.org/lmodel/fix-orchestra/Fixi
    description: Elements that an interfaces file holds.
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  OrchestraChangeKind:
    name: OrchestraChangeKind
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraChangeKind
    description: How far an element's latest change reaches.
    title: Orchestra change kind
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      Editorial:
        text: Editorial
        description: A change to wording only.
      Definitional:
        text: Definitional
        description: A change to what the element means.
  OrchestraLayer:
    name: OrchestraLayer
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraLayer
    description: The layer of the communication stack a protocol works on.
    title: Orchestra protocol layer
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      application:
        text: application
        description: The application layer.
      presentation:
        text: presentation
        description: The presentation layer, where encodings sit.
      session:
        text: session
        description: The session layer.
      transport:
        text: transport
        description: The transport layer.
  OrchestraMemberSelection:
    name: OrchestraMemberSelection
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraMemberSelection
    description: How many of a block's members must appear.
    title: Orchestra member selection
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      oneOf:
        text: oneOf
        description: Exactly one member appears.
      anyOf:
        text: anyOf
        description: One or more members appear.
  OrchestraMessageCast:
    name: OrchestraMessageCast
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraMessageCast
    description: How many receivers a transport sends each message to.
    title: Orchestra message casting
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      unicast:
        text: unicast
        description: One receiver.
      multicast:
        text: multicast
        description: A group of receivers.
      broadcast:
        text: broadcast
        description: Every receiver.
  OrchestraPresence:
    name: OrchestraPresence
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraPresence
    description: Whether an item must, may or must not appear in a message.
    title: Orchestra presence
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      optional:
        text: optional
        description: May appear; a rule can make it required.
      required:
        text: required
        description: Must appear.
      forbidden:
        text: forbidden
        description: Must not appear.
      ignored:
        text: ignored
        description: May appear, and is not checked.
      constant:
        text: constant
        description: Has a fixed value, which some encodings leave off the wire.
  OrchestraProtocolName:
    name: OrchestraProtocolName
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraProtocolName
    description: The FIX protocols the interfaces file names, so that they are spelled
      one way. A file may name another protocol.
    title: Orchestra protocol name
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      FIX4:
        text: FIX4
        description: The FIX 4 session layer.
      FIXT:
        text: FIXT
        description: FIXT 1.1, the session protocol of FIX 5.
      FIXP:
        text: FIXP
        description: FIXP, the FIX session protocol built for high performance.
      tagvalue:
        text: tagvalue
        description: Classic tag=value encoding.
      FIXML:
        text: FIXML
        description: FIX in XML.
      FAST:
        text: FAST
        description: The FAST streaming encoding.
      SBE:
        text: SBE
        description: Simple Binary Encoding.
      SOFH:
        text: SOFH
        description: The SOFH message framing header.
      GPB:
        text: GPB
        description: Google's protocol buffers.
      JSON:
        text: JSON
        description: JSON encoding.
      FIXS:
        text: FIXS
        description: FIX over TLS.
  OrchestraPurpose:
    name: OrchestraPurpose
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraPurpose
    description: The kinds of purpose the standard names for a text or hint. A file
      may give another purpose of its own.
    title: Orchestra text purpose
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      SYNOPSIS:
        text: SYNOPSIS
        description: A short summary.
      ELABORATION:
        text: ELABORATION
        description: A longer explanation.
      EXAMPLE:
        text: EXAMPLE
        description: An example of use.
      DISPLAY:
        text: DISPLAY
        description: A name to show to people in place of the element's own.
  OrchestraReliability:
    name: OrchestraReliability
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraReliability
    description: What a flow or protocol promises about delivering each message.
    title: Orchestra delivery guarantee
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      bestEffort:
        text: bestEffort
        description: No promise; any message can be lost.
      idempotent:
        text: idempotent
        description: Each message is acted on at most once; a lost one is not sent
          again.
      recoverable:
        text: recoverable
        description: Each message is acted on exactly once; a lost one can be sent
          again.
  OrchestraRole:
    name: OrchestraRole
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraRole
    description: A party's role in setting up a session.
    title: Orchestra session role
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      initiator:
        text: initiator
        description: The party that opens a FIX session.
      acceptor:
        text: acceptor
        description: The party that answers a request to open a FIX session.
      client:
        text: client
        description: The party that connects to a server.
      server:
        text: server
        description: The party that waits for clients to connect.
  OrchestraSupport:
    name: OrchestraSupport
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraSupport
    description: How a party treats an element of the standard.
    title: Orchestra support level
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      supported:
        text: supported
        description: The party supports the element.
      forbidden:
        text: forbidden
        description: The party refuses the element.
      ignored:
        text: ignored
        description: The party accepts the element and acts on none of it.
  OrchestraSynchronization:
    name: OrchestraSynchronization
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraSynchronization
    description: How the timing of a response relates to the request it answers.
    title: Orchestra response timing
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      asynchronous:
        text: asynchronous
        description: The response's timing has no tie to the request's.
      synchronous:
        text: synchronous
        description: A request waits until the one before it has its answer.
      pipelined:
        text: pipelined
        description: Each response follows its request, and several requests may wait
          for answers at once.
  OrchestraTimerOperation:
    name: OrchestraTimerOperation
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraTimerOperation
    description: What a step does to an actor's timer.
    title: Orchestra timer operation
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      START:
        text: START
        description: Start the timer.
      CANCEL:
        text: CANCEL
        description: Stop the timer.
      RESET:
        text: RESET
        description: Stop the timer and start it again.
  OrchestraTransportUse:
    name: OrchestraTransportUse
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraTransportUse
    description: The roles the interfaces file names for a transport. A file may give
      another role of its own.
    title: Orchestra transport use
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    permissible_values:
      primary:
        text: primary
        description: The main connection.
      secondary:
        text: secondary
        description: The backup connection.
      alternate:
        text: alternate
        description: Another connection, used in turn or by choice.
  OrchestraCategoryContentV10:
    name: OrchestraCategoryContentV10
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraCategoryContentV10
    description: What a category sorts, in v1.0.
    title: Orchestra category content (1.0)
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_0
    permissible_values:
      Field:
        text: Field
        description: The category sorts fields.
      Message:
        text: Message
        description: The category sorts messages.
  OrchestraCategoryIncludeFileV10:
    name: OrchestraCategoryIncludeFileV10
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraCategoryIncludeFileV10
    description: The shared FIXML file a category's own file includes, in v1.0.
    title: Orchestra category include file (1.0)
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_0
    permissible_values:
      components:
        text: components
        description: The shared file of components.
      fields:
        text: fields
        description: The shared file of fields.
  OrchestraDatatypeStandardV10:
    name: OrchestraDatatypeStandardV10
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraDatatypeStandardV10
    description: The standards v1.0 names for mapping a datatype. A file may give
      another standard of its own.
    title: Orchestra datatype standard (1.0)
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_0
    permissible_values:
      ISO11404:
        text: ISO11404
        description: The general-purpose datatypes of ISO/IEC 11404.
      GPB:
        text: GPB
        description: Google's protocol buffers.
      JSON:
        text: JSON
        description: JSON Schema.
      SBE:
        text: SBE
        description: Simple Binary Encoding.
      XML:
        text: XML
        description: XML Schema, as FIXML uses it.
      TAG_VALUE:
        text: TAG_VALUE
        description: The classic tag=value encoding.
  OrchestraUnionDatatypeV10:
    name: OrchestraUnionDatatypeV10
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraUnionDatatypeV10
    description: The datatypes v1.0 names whose values a field may hold beside its
      codes.
    title: Orchestra union datatype (1.0)
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_0
    permissible_values:
      Qty:
        text: Qty
        description: Quantities.
      Reserved100Plus:
        text: Reserved100Plus
        description: Values from 100 up, kept for user-defined codes.
      Reserved1000Plus:
        text: Reserved1000Plus
        description: Values from 1000 up, kept for user-defined codes.
      Reserved4000Plus:
        text: Reserved4000Plus
        description: Values from 4000 up, kept for user-defined codes.
      Tenor:
        text: Tenor
        description: Tenors, such as 3M.
  OrchestraPurposeV11:
    name: OrchestraPurposeV11
    definition_uri: https://w3id.org/lmodel/fix-orchestra/OrchestraPurposeV11
    description: The kinds of purpose the standard names for a text or hint. A file
      may give another purpose of its own.
    title: Orchestra text purpose (1.1-rc3)
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_1
    permissible_values:
      SYNOPSIS:
        text: SYNOPSIS
        description: A short summary.
      ELABORATION:
        text: ELABORATION
        description: A longer explanation.
      EXAMPLE:
        text: EXAMPLE
        description: An example of use.
      DISPLAY:
        text: DISPLAY
        description: A name to show to people in place of the element's own.
      CAPTION:
        text: CAPTION
        description: A label for a table, a figure or a heading.
      TOOLTIP:
        text: TOOLTIP
        description: A short hint shown when a pointer rests on the element.
      DEFINITION:
        text: DEFINITION
        description: A formal definition in one sentence.
slots:
  orchestraMetadata__dc_title:
    name: orchestraMetadata__dc_title
    annotations:
      xml_element:
        tag: xml_element
        value: '{http://purl.org/dc/elements/1.1/}title'
    description: The values the file gives for the Dublin Core element title.
    from_schema: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_common
    mappings:
    - dc:title
    slot_uri: dc:title
    alias: dc_title
    owner: OrchestraMetadata
    domain_of:
    - OrchestraMetadata
    range: string
    multivalued: true
  orchestraMetadata__dc_creator:
    name: orchestraMetadata__dc_creator
    annotations:
      xml_element:
        tag: xml_element
