        description: The FIX version in which another element took this one's place.
        range: string
        pattern: ^((FIX.2.7)|(FIX.3.0)|(FIX\.4\.[0-4])|((FIX.Latest|(FIX\.5\.0(SP\d{1,2})?))(_EP((9[8-9])|([1-9][0-9][0-9])))?)|(FIXT.1.1)|([0-9]+)\.([0-9]+)|(\d{8}))$
      fixr_replaced_ep:
        name: fixr_replaced_ep
        annotations:
          xml_attribute:
            tag: xml_attribute
            value: replacedEP
        description: The extension pack in which another element took this one's place.
