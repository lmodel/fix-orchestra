        value: dcterms.xsd
      xsd_group_members:
        tag: xsd_group_members
        value: any
    description: This group is included as a convenience for schema authors who need
      to refer to all the DC elements and element refinements in the http://purl.org/dc/elements/1.1/
      and http://purl.org/dc/terms namespaces. N.B. Refinements available via substitution
      groups.
    in_subset:
