    aliases:
    - purpose_enum
    exact_mappings:
    - fixr:purpose_enum
    enum_uri: fix_orchestra:PurposeEnum
    permissible_values:
      SYNOPSIS:
        text: SYNOPSIS
        description: Brief summary of the element, typically highlighting its key
          function or purpose, restricted to one paragraph for conciseness.
      ELABORATION:
        text: ELABORATION
        description: Detailed explanation of the element, clarifying its usage, functionality,
          or background.
      EXAMPLE:
        text: EXAMPLE
        description: Sample or illustration demonstrating how the element is used
          in practice.
      DISPLAY:
        text: DISPLAY
        description: For UI when different from canonical name; may have multi-language
          displays.
      CAPTION:
        text: CAPTION
        description: Descriptive label or title for the element, may be used for tables,
          figures, headings or brief annotations.
      TOOLTIP:
        text: TOOLTIP
        description: Short message or hint that appears when hovering over the element,
          usually explaining its function or use.
      DEFINITION:
        text: DEFINITION
        description: Precise and formal explanation of the element, restricted to
          one sentence in length to ensure brevity.
