    from_schema: https://w3id.org/lmodel/fix-orchestra
    aliases:
    - entityAttribGrp
    mappings:
    - fixr:entityAttribGrp
    mixin: true
    slots:
    - added
    - added_ep
    - change_type
    - deprecated_ep
    - issue
    - last_modified
    - replaced
    - replaced_ep
    - replaced_by_field
    - supported
    - updated
    - updated_ep
    - entityAttribGrp__deprecated
    attributes:
      deprecated:
        name: deprecated
        slot_uri: fixr:deprecated
        range: Version
    class_uri: fixr:entityAttribGrp
  FieldAttribGrp:
    name: FieldAttribGrp
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FieldAttribGrp
    description: Attributes of a field that be overridden by a rule
    in_subset:
    - repository_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    aliases:
    - fieldAttribGrp
    mappings:
    - fixr:fieldAttribGrp
    mixin: true
    slots:
    - min_inclusive
    - max_inclusive
    - impl_length
    - impl_min_length
    - impl_max_length
    - presence
    - FieldAttribGrp_value
    - rendering
    - fieldAttribGrp__encoding
    slot_usage:
      value:
        name: value
        description: If presence is optional, then it represents a default when the
