    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Currency
    typeof: string
    base: str
    uri: fix_orchestra:FIXCurrency
  FIXExchange:
    name: FIXExchange
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXExchange
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX Exchange datatype (extends String). string field representing
      a market or exchange using ISO 10383 Market Identifier Code (MIC) values (see"Appendix
      6-C).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Exchange
    typeof: string
    base: str
    uri: fix_orchestra:FIXExchange
  FIXMonthYear:
    name: FIXMonthYear
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXMonthYear
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX MonthYear datatype (extends String). string field representing
      month of a year. An optional day of the month can be appended or an optional
      week code.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:MonthYear
    typeof: string
    base: str
    uri: fix_orchestra:FIXMonthYear
  FIXUTCTimestamp:
    name: FIXUTCTimestamp
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXUTCTimestamp
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: Timestamp
    description: FIX UTCTimestamp datatype (extends String). string field representing
      time/date combination represented in UTC (Universal Time Coordinated, also known
      as "GMT") in either YYYYMMDD-HH:MM:SS (whole seconds) or YYYYMMDD-HH:MM:SS.sss*
      format, colons, dash, and period required.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:UTCTimestamp
    typeof: datetime
    base: XSDDateTime
    uri: fix_orchestra:FIXUTCTimestamp
    repr: str
  FIXUTCTimeOnly:
    name: FIXUTCTimeOnly
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXUTCTimeOnly
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: TimeOnly
    description: FIX UTCTimeOnly datatype (extends String). string field representing
      time-only represented in UTC (Universal Time Coordinated, also known as "GMT")
      in either HH:MM:SS (whole seconds) or HH:MM:SS.sss* (milliseconds) format, colons,
      and period required. This special-purpose field is paired with UTCDateOnly to
      form a proper UTCTimestamp for bandwidth-sensitive messages.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:UTCTimeOnly
    typeof: string
    base: str
    uri: fix_orchestra:FIXUTCTimeOnly
  FIXUTCDateOnly:
    name: FIXUTCDateOnly
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXUTCDateOnly
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX UTCDateOnly datatype (extends String). string field representing
      Date represented in UTC (Universal Time Coordinated, also known as "GMT") in
      YYYYMMDD format. This special-purpose field is paired with UTCTimeOnly to form
      a proper UTCTimestamp for bandwidth-sensitive messages.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:UTCDateOnly
    typeof: date
    base: XSDDate
    uri: fix_orchestra:FIXUTCDateOnly
    repr: str
  FIXLocalMktDate:
    name: FIXLocalMktDate
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXLocalMktDate
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX LocalMktDate datatype (extends String). string field representing
      a Date of Local Market (as opposed to UTC) in YYYYMMDD format. This is the "normal"
      date field used by the FIX Protocol.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:LocalMktDate
    typeof: date
    base: XSDDate
    uri: fix_orchestra:FIXLocalMktDate
    repr: str
  FIXTZTimeOnly:
    name: FIXTZTimeOnly
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXTZTimeOnly
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: TimeOnly
    description: FIX TZTimeOnly datatype (extends String). string field representing
      the time represented based on ISO 8601. This is the time with a UTC offset to
      allow identification of local time and timezone of that time.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:TZTimeOnly
    typeof: string
    base: str
    uri: fix_orchestra:FIXTZTimeOnly
  FIXTZTimestamp:
    name: FIXTZTimestamp
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXTZTimestamp
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: Timestamp
    description: FIX TZTimestamp datatype (extends String). string field representing
      a time/date combination representing local time with an offset to UTC to allow
      identification of local time and timezone offset of that time. The representation
      is based on ISO 8601.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:TZTimestamp
    typeof: datetime
    base: XSDDateTime
    uri: fix_orchestra:FIXTZTimestamp
    repr: str
  FIXData:
    name: FIXData
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXData
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: bytes
    description: 'FIX data base datatype. string field containing opaque or non-ASCII
      data with no format or content restrictions. Data fields are always immediately
      preceded by a length field. The length field should specify the number of bytes
      of the value of the data field (up to but not including the terminating SOH).
      The number of bytes does not equal the number of characters when multibyte character
      sets are used. Caution: The value of these fields may contain the delimiter
      (SOH) character. Note that the value specified for these fields must be followed
      by the delimiter (SOH) character as all tag-value fields are terminated with
      an SOH.'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:data
    typeof: string
    base: str
    uri: fix_orchestra:FIXData
  FIXPattern:
    name: FIXPattern
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXPattern
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX Pattern base datatype. Used to build on and provide some restrictions
      on what is allowed as valid values in fields that uses a base FIX data type
      and a pattern data type. The universe of allowable valid values for the field
      would then be the union of the base set of valid values and what is defined
      by the pattern data type. The pattern data type used by the field will retain
      its base FIX data type (e.g. String, int, char).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Pattern
    typeof: string
    base: str
    uri: fix_orchestra:FIXPattern
  FIXTenor:
    name: FIXTenor
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXTenor
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: Tenor
    description: 'FIX Tenor datatype (extends Pattern). used to allow the expression
      of FX standard tenors in addition to the base valid enumerations defined for
      the field that uses this pattern data type. This pattern data type is defined
      as follows:'
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Tenor
    typeof: string
    base: str
    uri: fix_orchestra:FIXTenor
  FIXReserved100Plus:
    name: FIXReserved100Plus
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXReserved100Plus
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: fixed32
    description: FIX Reserved100Plus datatype (extends Pattern). Values "100" and
      above are reserved for bilaterally agreed upon user defined enumerations.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Reserved100Plus
    typeof: integer
    base: int
    uri: fix_orchestra:FIXReserved100Plus
  FIXReserved1000Plus:
    name: FIXReserved1000Plus
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXReserved1000Plus
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: fixed32
    description: FIX Reserved1000Plus datatype (extends Pattern). Values "1000" and
      above are reserved for bilaterally agreed upon user defined enumerations.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Reserved1000Plus
    typeof: integer
    base: int
    uri: fix_orchestra:FIXReserved1000Plus
  FIXReserved4000Plus:
    name: FIXReserved4000Plus
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXReserved4000Plus
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: fixed32
    description: FIX Reserved4000Plus datatype (extends Pattern). Values "4000" and
      above are reserved for bilaterally agreed upon user defined enumerations.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Reserved4000Plus
    typeof: integer
    base: int
    uri: fix_orchestra:FIXReserved4000Plus
  FIXXMLData:
    name: FIXXMLData
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXXMLData
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX XMLData datatype (extends String). Contains an XML document raw
      data with no format or content restrictions. XMLData fields are always immediately
      preceded by a length field. The length field should specify the number of bytes
      of the value of the data field (up to but not including the terminating SOH).
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:XMLData
    typeof: string
    base: str
    uri: fix_orchestra:FIXXMLData
  FIXLanguage:
    name: FIXLanguage
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXLanguage
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX Language datatype (extends String). Identifier for a national
      language - uses ISO 639-1 standard
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:Language
    typeof: string
    base: str
    uri: fix_orchestra:FIXLanguage
  FIXLocalMktTime:
    name: FIXLocalMktTime
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXLocalMktTime
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: TimeOnly
    description: FIX LocalMktTime datatype (extends String). string field representing
      the time local to a particular market center. Used where offset to UTC varies
      throughout the year and the defining market center is identified in a corresponding
      field.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:LocalMktTime
    typeof: string
    base: str
    uri: fix_orchestra:FIXLocalMktTime
  FIXXID:
    name: FIXXID
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXXID
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX XID datatype (extends String). The purpose of the XID datatype
      is to define a unique identifier that is global to a FIX message. An identifier
      defined using this datatype uniquely identifies its containing element, whatever
      its type and name is. The constraint added by this datatype is that the values
      of all the fields that have an XID datatype in a FIX message must be unique.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:XID
    typeof: string
    base: str
    uri: fix_orchestra:FIXXID
  FIXXIDREF:
    name: FIXXIDREF
    definition_uri: https://w3id.org/lmodel/fix-orchestra/FIXXIDREF
    annotations:
      proto_scalar:
        tag: proto_scalar
        value: string
    description: FIX XIDREF datatype (extends String). The XIDREF datatype defines
      a reference to an identifier defined by the XID datatype.
    in_subset:
    - fix_base_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    exact_mappings:
    - fixr:XIDREF
    typeof: string
    base: str
    uri: fix_orchestra:FIXXIDREF
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  DcmitypeDCMIType:
    name: DcmitypeDCMIType
    definition_uri: https://w3id.org/lmodel/fix-orchestra/DcmitypeDCMIType
    description: 'Union of: '
