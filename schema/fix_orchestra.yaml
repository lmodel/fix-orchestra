        text: optional
        description: The field or component MAY be present; it may be conditionally
          required based on a rule.
      required:
        text: required
        description: The field or component MUST be present.
      forbidden:
        text: forbidden
        description: The field or component MUST NOT be present.
      ignored:
        text: ignored
        description: The field or component MAY be present but is not validated.
      constant:
        text: constant
        description: The field has a constant value; in some encodings it need not
