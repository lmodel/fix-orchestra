    enum_uri: fixr:memberType
    permissible_values:
      oneOf:
        text: oneOf
        description: Members are mutually exclusive; exactly one must be present.
      anyOf:
        text: anyOf
        description: At least one of the members must be present.
  Presence:
    name: Presence
    definition_uri: https://w3id.org/lmodel/fix-orchestra/Presence
    in_subset:
    - repository_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    aliases:
    - presence_t
    enum_uri: fixr:presence_t
    permissible_values:
      optional:
        text: optional
        description: The field or component MAY be present; it may be conditionally
          required based on a rule.
      required:
        text: required
        description: The field or component MUST be present.
      forbidden:
        text: forbidden
        description: The field or component MUST NOT be present.
      ignored:
        text: ignored
        description: The field or component MAY be present but is not validated.
      constant:
        text: constant
        description: The field has a constant value; in some encodings it need not
          be sent on the wire.
  PurposeEnum:
    name: PurposeEnum
    definition_uri: https://w3id.org/lmodel/fix-orchestra/PurposeEnum
    description: Recommended annotation purposes
    in_subset:
    - repository_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    aliases:
    - purpose_enum
    enum_uri: fixr:purpose_enum
    permissible_values:
      SYNOPSIS:
        text: SYNOPSIS
        description: Brief summary of the element, typically highlighting its key
          function or purpose, restricted to one paragraph for conciseness.
      ELABORATION:
        text: ELABORATION
        description: Detailed explanation of the element, clarifying its usage, functionality,
          or background.
      EXAMPLE:
        text: EXAMPLE
        description: Sample or illustration demonstrating how the element is used
          in practice.
      DISPLAY:
        text: DISPLAY
        description: For UI when different from canonical name; may have multi-language
          displays.
      CAPTION:
        text: CAPTION
        description: Descriptive label or title for the element, may be used for tables,
          figures, headings or brief annotations.
      TOOLTIP:
        text: TOOLTIP
        description: Short message or hint that appears when hovering over the element,
          usually explaining its function or use.
      DEFINITION:
        text: DEFINITION
        description: Precise and formal explanation of the element, restricted to
          one sentence in length to ensure brevity.
  Reliability:
    name: Reliability
    definition_uri: https://w3id.org/lmodel/fix-orchestra/Reliability
    description: Message delivery gurantee
    in_subset:
    - repository_types
    from_schema: https://w3id.org/lmodel/fix-orchestra
    aliases:
