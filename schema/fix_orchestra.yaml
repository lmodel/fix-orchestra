    from_schema: https://w3id.org/lmodel/fix-orchestra
    aliases:
    - elementsAndRefinementsGroup
    mappings:
    - dct:elementsAndRefinementsGroup
    mixin: true
    class_uri: dct:elementsAndRefinementsGroup
  XmlSpecialAttrs:
    name: XmlSpecialAttrs
    definition_uri: https://w3id.org/lmodel/fix-orchestra/XmlSpecialAttrs
    in_subset:
    - xml_namespace
    from_schema: https://w3id.org/lmodel/fix-orchestra
    aliases:
    - specialAttrs
    mappings:
    - xml:specialAttrs
    mixin: true
    slots:
    - xmlSpecialAttrs__base
    - xmlSpecialAttrs__lang
    - xmlSpecialAttrs__space
    - xmlSpecialAttrs__id
    attributes:
      base:
        name: base
        range: string
      lang:
        name: lang
        range: string
      space:
        name: space
        range: string
      id:
        name: id
        range: string
    class_uri: xml:specialAttrs
  XmlGlobalAttributes:
    name: XmlGlobalAttributes
    definition_uri: https://w3id.org/lmodel/fix-orchestra/XmlGlobalAttributes
    annotations:
      xsd_source:
        tag: xsd_source
        value: xml.xsd
    description: Container for the global <xs:attribute> declarations defined in xml.xsd.
      Each attribute here is referenceable from other XSDs via ``ref="xml:<name>"``.
    in_subset:
    - xml_namespace
    from_schema: https://w3id.org/lmodel/fix-orchestra
    mappings:
    - xml:GlobalAttributes
    slots:
    - xmlGlobalAttributes__lang
    - xmlGlobalAttributes__space
    - xmlGlobalAttributes__base
    - xmlGlobalAttributes__id
    attributes:
      lang:
        name: lang
        description: lang (as an attribute name) denotes an attribute whose value
          is a language code for the natural language of the content of any element;
          its value is inherited. This name is reserved by virtue of its definition
          in the XML specification. Notes Attempting to install the relevant ISO 2-
          and 3-letter codes as the enumerated possible values is probably never going
          to be a realistic possibility. See BCP 47 at http://www.rfc-editor.org/rfc/bcp/bcp47.txt
          and the IANA language subtag registry at http://www.iana.org/assignments/language-subtag-registry
          for further information. The union allows for the 'un-declaration' of xml:lang
          with the empty string.
        slot_uri: xml:lang
        range: XmlLangType
      space:
        name: space
        description: space (as an attribute name) denotes an attribute whose value
          is a keyword indicating what whitespace processing discipline is intended
          for the content of the element; its value is inherited. This name is reserved
          by virtue of its definition in the XML specification.
        slot_uri: xml:space
        range: XmlSpaceType
      base:
        name: base
        description: base (as an attribute name) denotes an attribute whose value
          provides a URI to be used as the base for interpreting any relative URIs
          in the scope of the element on which it appears; its value is inherited.
          This name is reserved by virtue of its definition in the XML Base specification.
          See http://www.w3.org/TR/xmlbase/ for information about this attribute.
        slot_uri: xml:base
        range: uri
      id:
        name: id
        description: id (as an attribute name) denotes an attribute whose value should
          be interpreted as if declared to be of type ID. This name is reserved by
          virtue of its definition in the xml:id specification. See http://www.w3.org/TR/xml-id/
          for information about this attribute.
        slot_uri: xml:id
        range: string
    class_uri: xml:GlobalAttributes
  EntityAttribGrp:
    name: EntityAttribGrp
    definition_uri: https://w3id.org/lmodel/fix-orchestra/EntityAttribGrp
    in_subset:
