    class_uri: fixi:appinfo
    aliases:
    - appinfo
    in_subset:
    - interfaces
    attributes:
      lang_id:
        range: string
        slot_uri: fixi:langId
        aliases:
        - langId

      purpose:
        range: InterfacePurpose
        slot_uri: fixi:purpose
    annotations:
      xsd_source: interfaces.xsd
      xsd_any_attribute: true
    slots:
    - spec_url
    - value
    - content
    - extra_attributes
    slot_usage:
      spec_url:
        slot_uri: fixi:specUrl

  BaseInterfaceType:
    abstract: true
    class_uri: fixi:baseInterfaceType
    aliases:
    - baseInterfaceType
    in_subset:
    - interfaces
    attributes:
      encoding:
        range: EncodingType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixi:encoding

      annotation:
        range: InterfaceAnnotation
        slot_uri: fixi:annotation

      name:
        range: string
        required: true
        slot_uri: fixi:name
    annotations:
      xsd_source: interfaces.xsd
      xsd_any_attribute: true
    slots:
    - service
    - user_interface
    - session_protocol
    - protocol
    - transport
    - extra_attributes

  InterfaceDocumentation:
    class_uri: fixi:documentation
    aliases:
    - documentation
    in_subset:
    - interfaces
    attributes:
      lang_id:
        range: string
        slot_uri: fixi:langId
        aliases:
        - langId

      purpose:
        range: InterfacePurpose
        slot_uri: fixi:purpose

      content_type:
        range: string
        ifabsent: string(text/plain)
        slot_uri: fixi:contentType
        aliases:
        - contentType
    annotations:
      xsd_source: interfaces.xsd
    slots:
    - value
    - content

  EncodingType:
    is_a: ProtocolType
    class_uri: fixi:encodingType
    aliases:
    - encodingType
    in_subset:
    - interfaces
    annotations:
      xsd_source: interfaces.xsd

  SessionsInline:
    in_subset:
    - interfaces
    annotations:
      xsd_anonymous_inline: true
    slots:
    - session

  InterfaceType:
    is_a: BaseInterfaceType
    class_uri: fixi:interfaceType
    aliases:
    - interfaceType
    in_subset:
    - interfaces
    annotations:
      xsd_source: interfaces.xsd
    slots:
    - sessions

  ProtocolType:
    class_uri: fixi:protocolType
    aliases:
    - protocolType
    in_subset:
    - interfaces
    attributes:
      annotation:
        range: InterfaceAnnotation
        slot_uri: fixi:annotation

      name:
        range: ProtocolName
        slot_uri: fixi:name

      version:
        range: string
        slot_uri: fixi:version

      deprecated:
        range: datetime
        description: When this version was deprecated; may be replaced or removed in the future
        slot_uri: fixi:deprecated

      reliability:
        range: InterfaceReliability
        description: Reliability can be implemented at transport, session, or application layers
        slot_uri: fixi:reliability
    annotations:
      xsd_source: interfaces.xsd
      xsd_any_attribute: true
    slots:
    - activation_time
    - deactivation_time
    - layer
    - orchestration
    - extra_attributes

  ServiceType:
    is_a: ProtocolType
    class_uri: fixi:serviceType
    aliases:
    - serviceType
    in_subset:
    - interfaces
    annotations:
      xsd_source: interfaces.xsd

  SessionProtocolType:
    is_a: ProtocolType
    class_uri: fixi:sessionProtocolType
    aliases:
    - sessionProtocolType
    in_subset:
    - interfaces
    annotations:
      xsd_source: interfaces.xsd

  SessionType:
    is_a: BaseInterfaceType
    class_uri: fixi:sessionType
    aliases:
    - sessionType
    in_subset:
    - interfaces
    attributes:
      identifier:
        range: IdentifierType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixi:identifier
    annotations:
      xsd_source: interfaces.xsd
    slots:
    - role
    - security_keys
    - activation_time
    - deactivation_time
    slot_usage:
      activation_time:
        description: When this session becomes effective
      deactivation_time:
        description: When this session is no longer effective

  TransportProtocolType:
    is_a: ProtocolType
    class_uri: fixi:transportProtocolType
    aliases:
    - transportProtocolType
    in_subset:
    - interfaces
    annotations:
      xsd_source: interfaces.xsd
      xsd_any_attribute: true
    slots:
    - address
    - message_cast
    - use
    - extra_attributes

  UserInterfaceType:
    is_a: ProtocolType
    class_uri: fixi:userInterfaceType
    aliases:
    - userInterfaceType
    in_subset:
    - interfaces
    annotations:
      xsd_source: interfaces.xsd

  Datatype:
    mixins:
    - EntityAttribGrp
