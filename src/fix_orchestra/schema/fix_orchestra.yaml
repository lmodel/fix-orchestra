  which:
    range: MemberType
    slot_uri: fixr:which
    description: Member selection within each group instance

  length_id:
    range: Id
    description: Identifies a field used as a length prefix
    slot_uri: fixr:lengthId
    aliases:
    - lengthId

  non_encoded_field_id:
    range: Id
    description: Identifies a non-encoded field related to an encoded field
    slot_uri: fixr:nonEncodedFieldId
    aliases:
    - nonEncodedFieldId

  unique:
    range: UniqueInline
    slot_uri: fixr:unique

  discriminator_id:
    range: Id
