    - dcterms
    annotations:
      xsd_source: dcterms.xsd
      xsd_group_members: any

  XmlSpecialAttrs:
    mixin: true
    class_uri: xml:specialAttrs
    aliases:
    - specialAttrs
    in_subset:
    - xml_namespace
    attributes:
      base:
        range: string

      lang:
        range: string

      space:
        range: string

      id:
        range: string

  XmlGlobalAttributes:
    description: Container for the global <xs:attribute> declarations defined in xml.xsd. Each attribute here is referenceable from other XSDs via ``ref="xml:<name>"``.
    class_uri: xml:GlobalAttributes
    in_subset:
    - xml_namespace
    annotations:
      xsd_source: xml.xsd
    attributes:
      lang:
        range: XmlLangType
        description: lang (as an attribute name) denotes an attribute whose value is a language code for the natural language of the content of any element; its value is inherited. This name is reserved by virtue of its definition in the XML specification. Notes Attempting to install the relevant ISO 2- and 3-letter codes as the enumerated possible values is probably never going to be a realistic possibility. See BCP 47 at http://www.rfc-editor.org/rfc/bcp/bcp47.txt and the IANA language subtag registry at http://www.iana.org/assignments/language-subtag-registry for further information. The union allows for the 'un-declaration' of xml:lang with the empty string.
        slot_uri: xml:lang

      space:
        range: XmlSpaceType
        description: space (as an attribute name) denotes an attribute whose value is a keyword indicating what whitespace processing discipline is intended for the content of the element; its value is inherited. This name is reserved by virtue of its definition in the XML specification.
        slot_uri: xml:space

      base:
        range: uri
        description: base (as an attribute name) denotes an attribute whose value provides a URI to be used as the base for interpreting any relative URIs in the scope of the element on which it appears; its value is inherited. This name is reserved by virtue of its definition in the XML Base specification. See http://www.w3.org/TR/xmlbase/ for information about this attribute.
        slot_uri: xml:base

      id:
        range: string
        description: id (as an attribute name) denotes an attribute whose value should be interpreted as if declared to be of type ID. This name is reserved by virtue of its definition in the xml:id specification. See http://www.w3.org/TR/xml-id/ for information about this attribute.
        slot_uri: xml:id

