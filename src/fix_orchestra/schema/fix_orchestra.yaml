  impl_max_occurs:
    range: UnboundedIntType
    ifabsent: string(unbounded)
    slot_uri: fixr:implMaxOccurs
    aliases:
    - implMaxOccurs
    description: Upper bound of group instances (numInGroup)

  num_in_group:
    range: FieldRefType
    slot_uri: fixr:numInGroup
    aliases:
    - numInGroup

  correlate:
