        required: true
        slot_uri: 'fixr:name'

      version:
        range: Version
        required: true
        slot_uri: 'fixr:version'

      guid:
        range: string
        slot_uri: 'fixr:guid'

      spec_url:
        range: uri
        description: Reference documentation
        slot_uri: 'fixr:specUrl'
        aliases:
          - specUrl

      namespace:
        range: uri
        description: An associated namespace as URI
        slot_uri: 'fixr:namespace'

      expression_language:
        range: string
        description: "The syntax of 'expressionType'"
        ifabsent: string(Score)
        slot_uri: 'fixr:expressionLanguage'
        aliases:
          - expressionLanguage
    unique_keys:
      datatype_ref_key:
        description: 'From XSD <xs:key name="datatypeRefKey"> with selector "fixr:datatypes/fixr:datatype".'
        unique_key_slots:
          - name
          - scenario_id

      code_set_ref_key:
        description: 'From XSD <xs:key name="codeSetRefKey"> with selector "fixr:codeSets/fixr:codeSet".'
        unique_key_slots:
          - name
          - scenario_id

      scenario_name_key:
        description: 'From XSD <xs:key name="scenarioNameKey"> with selector "fixr:scenarios/fixr:scenario".'
        unique_key_slots:
          - name

      scenario_id_key:
        description: 'From XSD <xs:key name="scenarioIdKey"> with selector "fixr:scenarios/fixr:scenario".'
        unique_key_slots:
          - id
    annotations:
      xsd_source: repository.xsd
      xsd_keyrefs: 'typeKeyref(refer=fixr:datatypeRefKey, selector=fixr:fields/fixr:field, fields=[@type,@scenarioId]); codeSetKeyref(refer=fixr:codeSetRefKey, selector=fixr:fields/fixr:field, fields=[@codeSet,@scenarioId]); codeSetScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:codeSet, fields=[@scenarioId]); datatypeScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:datatype, fields=[@scenarioId]); componentScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:component, fields=[@scenarioId]); groupScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:group, fields=[@scenarioId]); messageScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:message, fields=[@scenarioId])'

  Scenarios:
    class_uri: 'fixr:scenarios'
    aliases:
      - scenarios
    in_subset:
      - repository
    attributes:
      scenario:
        range: ScenarioType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: 'fixr:scenario'

      annotation:
        range: Annotation
        slot_uri: 'fixr:annotation'

      base:
        range: string
        slot_uri: 'fixr:base'
    annotations:
      xsd_source: repository.xsd
    description: "The default scenario is id='1' name='base'."

  Sections:
    class_uri: 'fixr:sections'
    aliases:
      - sections
    in_subset:
      - repository
    attributes:
      section:
        range: SectionType
        description: A large-grained business process category
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: 'fixr:section'

      annotation:
        range: Annotation
        slot_uri: 'fixr:annotation'

      base:
        range: string
        slot_uri: 'fixr:base'
    annotations:
      xsd_source: repository.xsd

  Interfaces:
    tree_root: true
    class_uri: 'fixi:interfaces'
    aliases:
      - interfaces
    in_subset:
      - interfaces
    attributes:
      metadata:
        range: DctermsElementOrRefinementContainer
        required: true
        slot_uri: 'fixi:metadata'

      interface:
        range: InterfaceType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: 'fixi:interface'
    unique_keys:
      interface_key:
        description: 'From XSD <xs:key name="interfaceKey"> with selector "fixi:interface".'
        unique_key_slots:
          - name

      session_key:
        description: 'From XSD <xs:key name="sessionKey"> with selector "fixi:interface/fixi:sessions/fixi:session".'
        unique_key_slots:
          - name
    annotations:
      xsd_source: interfaces.xsd
    description: This represents the current state of service and session configurations. Changes to configuration can represented with patch operations. See IETF RFC 5261
