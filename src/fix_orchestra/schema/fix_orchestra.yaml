    slot_uri: fixr:discriminatorId
    aliases:
    - discriminatorId

  base_category:
    range: Name
    slot_uri: fixr:baseCategory
    aliases:
    - baseCategory

  base_category_abbr_name:
    range: Name
    slot_uri: fixr:baseCategoryAbbrName
    aliases:
