    attributes:
      id:
        range: Id
        description: Numeric identifier generally must be unique within a file for an element type, e.g. unique field tag
        required: true
        slot_uri: fixr:id

      name:
        range: Name
        required: true
        slot_uri: fixr:name

      scenario:
        range: Name
        description: The use case of an element, distinguished by workflow, asset class, etc.
        ifabsent: string(base)
