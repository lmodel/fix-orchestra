    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:correlate

  extension:
    range: ExtensionInline
    description: A datatype may be mapped to an XML snippet in the native schema belonging to its encoding standard.
    slot_uri: fixr:extension

  standard:
    range: DatatypeStandard
    required: true
    slot_uri: fixr:standard

  builtin:
    range: boolean
    slot_uri: fixr:builtin

  pattern:
    range: string
    description: A lexical restriction from a base type
    slot_uri: fixr:pattern

  element:
    range: string
    description: Element type of an aggregate type such as an array or sequence
    slot_uri: fixr:element

