        range: Id
        description: Numeric identifier generally must be unique within a file for an element type, e.g. unique field tag
        required: true
        slot_uri: fixr:id

      name:
        range: Name
        description: The name is optional as part of a reference and only for convenience. It is not enforced by referential integrity. However, the name of the referred object is authoritative. A validator may check the consistency between the name used for the reference and the name of the referred object.
        slot_uri: fixr:name

      scenario:
