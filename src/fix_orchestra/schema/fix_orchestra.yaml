        slot_uri: fixr:name

      scenario:
        range: Name
        description: The use case of a datatype by name
        ifabsent: string(base)
        slot_uri: fixr:scenario
    annotations:
      xsd_source: repositorytypes.xsd
    slots:
    - mapped_datatype
    - scenario_id
    - base_type

  Actors:
    class_uri: fixr:actors
    aliases:
    - actors
    in_subset:
    - repository
    attributes:
      actor:
        range: ActorType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixr:actor

      flow:
        range: FlowType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixr:flow

      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      actor_key:
        description: From XSD <xs:key name="actorKey"> with selector "fixr:actor".
        unique_key_slots:
        - name
    annotations:
      xsd_source: repository.xsd
      xsd_keyrefs: producerKeyRef(refer=fixr:actorKey, selector=fixr:flow, fields=[@source]); consumerKeyRef(refer=fixr:actorKey, selector=fixr:flow, fields=[@destination])
    description: Participants and the message flows between them

  Categories:
    class_uri: fixr:categories
    aliases:
    - categories
    in_subset:
    - repository
    attributes:
      category:
        range: CategoryType
        description: A business process category, a subcategory of a businessArea
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixr:category

      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    annotations:
      xsd_source: repository.xsd

  CodeSets:
    class_uri: fixr:codeSets
    aliases:
    - codeSets
    in_subset:
    - repository
    attributes:
      code_set:
        range: CodeSetType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixr:codeSet
        aliases:
        - codeSet

      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      code_set_name_key:
        description: From XSD <xs:key name="codeSetNameKey"> with selector "fixr:codeSet".
        unique_key_slots:
        - name
        - scenario

      code_set_id_key:
        description: From XSD <xs:key name="codeSetIdKey"> with selector "fixr:codeSet".
        unique_key_slots:
        - id
        - scenario_id
    annotations:
      xsd_source: repository.xsd

  Components:
    class_uri: fixr:components
    aliases:
    - components
    in_subset:
    - repository
    attributes:
      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      component_name_key:
        description: From XSD <xs:key name="componentNameKey"> with selector "fixr:component".
        unique_key_slots:
        - name
        - scenario

      component_id_key:
        description: From XSD <xs:key name="componentIdKey"> with selector "fixr:component".
        unique_key_slots:
        - id
        - scenario_id
    annotations:
      xsd_source: repository.xsd
    slots:
    - component

  Concepts:
    class_uri: fixr:concepts
    aliases:
    - concepts
    in_subset:
    - repository
    attributes:
      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      concept_key:
        description: From XSD <xs:key name="conceptKey"> with selector "fixr:concept".
        unique_key_slots:
        - name
    annotations:
      xsd_source: repository.xsd
    slots:
    - concept

  Datatypes:
    class_uri: fixr:datatypes
    aliases:
    - datatypes
    in_subset:
    - repository
    attributes:
      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      datatype_key:
        description: From XSD <xs:key name="datatypeKey"> with selector "fixr:datatype".
        unique_key_slots:
        - name
        - scenario_id
    annotations:
      xsd_source: repository.xsd
    slots:
    - datatype

  Fields:
    class_uri: fixr:fields
    aliases:
    - fields
    in_subset:
    - repository
    attributes:
      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      field_name_key:
        description: From XSD <xs:key name="fieldNameKey"> with selector "fixr:field".
        unique_key_slots:
        - name
        - scenario

      field_id_key:
        description: From XSD <xs:key name="fieldIdKey"> with selector "fixr:field".
        unique_key_slots:
        - id
        - scenario_id
    annotations:
      xsd_source: repository.xsd
    slots:
    - field

  Groups:
    class_uri: fixr:groups
    aliases:
    - groups
    in_subset:
    - repository
    attributes:
      group:
        range: GroupType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixr:group

      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      group_name_key:
        description: From XSD <xs:key name="groupNameKey"> with selector "fixr:group".
        unique_key_slots:
        - name
        - scenario

      group_id_key:
        description: From XSD <xs:key name="groupIdKey"> with selector "fixr:group".
        unique_key_slots:
        - id
        - scenario_id
    annotations:
      xsd_source: repository.xsd

  Messages:
    class_uri: fixr:messages
    aliases:
    - messages
    in_subset:
    - repository
    attributes:
      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    unique_keys:
      message_name_key:
        description: From XSD <xs:key name="messageNameKey"> with selector "fixr:message".
        unique_key_slots:
        - name
        - scenario

      message_id_key:
        description: From XSD <xs:key name="messageIdKey"> with selector "fixr:message".
        unique_key_slots:
        - id
        - scenario_id
    annotations:
      xsd_source: repository.xsd
    slots:
    - message

  Repository:
    tree_root: true
    class_uri: fixr:repository
    aliases:
    - repository
    in_subset:
    - repository
    attributes:
      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      name:
        range: string
        description: Stable name that does not change with minor version updates
        required: true
        slot_uri: fixr:name

      version:
        range: Version
        required: true
        slot_uri: fixr:version
    unique_keys:
      datatype_ref_key:
        description: From XSD <xs:key name="datatypeRefKey"> with selector "fixr:datatypes/fixr:datatype".
        unique_key_slots:
        - name
        - scenario_id

      code_set_ref_key:
        description: From XSD <xs:key name="codeSetRefKey"> with selector "fixr:codeSets/fixr:codeSet".
        unique_key_slots:
        - name
        - scenario_id

      scenario_name_key:
        description: From XSD <xs:key name="scenarioNameKey"> with selector "fixr:scenarios/fixr:scenario".
        unique_key_slots:
        - name

      scenario_id_key:
        description: From XSD <xs:key name="scenarioIdKey"> with selector "fixr:scenarios/fixr:scenario".
        unique_key_slots:
        - id
    annotations:
      xsd_source: repository.xsd
      xsd_keyrefs: typeKeyref(refer=fixr:datatypeRefKey, selector=fixr:fields/fixr:field, fields=[@type,@scenarioId]); codeSetKeyref(refer=fixr:codeSetRefKey, selector=fixr:fields/fixr:field, fields=[@codeSet,@scenarioId]); codeSetScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:codeSet, fields=[@scenarioId]); datatypeScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:datatype, fields=[@scenarioId]); componentScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:component, fields=[@scenarioId]); groupScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:group, fields=[@scenarioId]); messageScenarioKeyRef(refer=fixr:scenarioIdKey, selector=fixr:message, fields=[@scenarioId])
    slots:
    - metadata
    - categories
    - sections
    - datatypes
    - code_sets
    - fields
    - actors
    - components
    - groups
    - messages
    - concepts
    - scenarios
    - guid
    - spec_url
    - namespace
    - expression_language

  Scenarios:
    class_uri: fixr:scenarios
    aliases:
    - scenarios
    in_subset:
    - repository
    attributes:
      scenario:
        range: ScenarioType
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixr:scenario

      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    annotations:
      xsd_source: repository.xsd
    description: The default scenario is id='1' name='base'.

  Sections:
    class_uri: fixr:sections
    aliases:
    - sections
    in_subset:
    - repository
    attributes:
      section:
        range: SectionType
        description: A large-grained business process category
        multivalued: true
        inlined: true
        inlined_as_list: true
        slot_uri: fixr:section

      annotation:
        range: Annotation
        slot_uri: fixr:annotation

      base:
        range: string
        slot_uri: fixr:base
    annotations:
      xsd_source: repository.xsd

  Interfaces:
    tree_root: true
    class_uri: fixi:interfaces
    aliases:
    - interfaces
    in_subset:
    - interfaces
    unique_keys:
      interface_key:
        description: From XSD <xs:key name="interfaceKey"> with selector "fixi:interface".
        unique_key_slots:
        - name

      session_key:
        description: From XSD <xs:key name="sessionKey"> with selector "fixi:interface/fixi:sessions/fixi:session".
        unique_key_slots:
        - name
    annotations:
      xsd_source: interfaces.xsd
    description: This represents the current state of service and session configurations. Changes to configuration can represented with patch operations. See IETF RFC 5261
    slots:
    - metadata
    - interface
    slot_usage:
      metadata:
        slot_uri: fixi:metadata
slots:
  added:
    range: Version
    slot_uri: fixr:added

  added_ep:
    range: EP
    slot_uri: fixr:addedEP
    aliases:
    - addedEP

  change_type:
    range: ChangeType
    slot_uri: fixr:changeType
    aliases:
    - changeType

  deprecated_ep:
    range: EP
    slot_uri: fixr:deprecatedEP
    aliases:
    - deprecatedEP

  issue:
    range: string
    slot_uri: fixr:issue

  last_modified:
    range: Version
    slot_uri: fixr:lastModified
    aliases:
    - lastModified

  replaced:
    range: Version
    slot_uri: fixr:replaced

  replaced_ep:
    range: EP
    slot_uri: fixr:replacedEP
    aliases:
    - replacedEP

  replaced_by_field:
    range: Id
    slot_uri: fixr:replacedByField
    aliases:
    - replacedByField

  supported:
    range: SupportType
    ifabsent: string(supported)
    slot_uri: fixr:supported

  updated:
    range: Version
    slot_uri: fixr:updated

  updated_ep:
    range: EP
    slot_uri: fixr:updatedEP
    aliases:
    - updatedEP

  min_inclusive:
    range: string
    description: Inclusive lower bound
    slot_uri: fixr:minInclusive
    aliases:
    - minInclusive

  max_inclusive:
    range: string
    description: Inclusive upper bound
    slot_uri: fixr:maxInclusive
    aliases:
    - maxInclusive

  impl_length:
    range: integer
    description: Fixed length
    slot_uri: fixr:implLength
    aliases:
    - implLength

  impl_min_length:
    range: integer
    slot_uri: fixr:implMinLength
    aliases:
    - implMinLength

  impl_max_length:
    range: integer
    slot_uri: fixr:implMaxLength
    aliases:
    - implMaxLength

  presence:
    range: Presence
    ifabsent: string(optional)
    slot_uri: fixr:presence
    description: Overrides presence when expression is true

  rendering:
    range: string
    description: A hint to processes about how to interpret the element. Not validated.
    slot_uri: fixr:rendering

  abbr_name:
    range: Name
    slot_uri: fixr:abbrName
    aliases:
    - abbrName

  scenario_id:
    range: Id
    description: Unique identifier of a scenario. Default is '1' for base scenario.
    ifabsent: string(1)
    slot_uri: fixr:scenarioId
    aliases:
    - scenarioId

  scenario_ref_id:
    range: Id
    description: Unique identifier of a scenario. The identifier is required when referencing another scenario.
    slot_uri: fixr:scenarioRefId
    aliases:
    - scenarioRefId

  scenario_ref:
    range: Name
    description: Name of a scenario. The name is optional as part of a reference and only for convenience.
    slot_uri: fixr:scenarioRef
    aliases:
    - scenarioRef

  field:
    range: FieldType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:field

  field_ref:
    range: FieldRefType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:fieldRef
    aliases:
    - fieldRef
    description: Other field or fields that scope uniqueness. If none provided, then the field value must be globally unique.

  component:
    range: ComponentType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:component

  component_ref:
    range: ComponentRefType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:componentRef
    aliases:
    - componentRef

  group_ref:
    range: GroupRefType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:groupRef
    aliases:
    - groupRef

  message_ref:
    range: MessageRefType
    description: Send a message
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:messageRef
    aliases:
    - messageRef

  trigger:
    range: TriggerType
    description: Trigger a state transtion in a state machine
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:trigger

  timer_schedule:
    range: TimerSchedule
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:timerSchedule
    aliases:
    - timerSchedule

  states:
    range: StateMachineType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:states

  timer:
    range: TimerType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:timer

  spec_url:
    range: uri
    description: Reference documentation
    slot_uri: fixr:specUrl
    aliases:
    - specUrl

  extra_attributes:
    range: string
    multivalued: true
    description: Pass-through xs:anyAttribute values keyed by their XML attribute name (open extension point).

  fixml_file_name:
    range: Name
    slot_uri: fixr:FIXMLFileName
    aliases:
    - FIXMLFileName

  component_type:
    range: CatComponentType
    slot_uri: fixr:componentType
    aliases:
    - componentType

  include_file:
    range: CatIncludeFile
    slot_uri: fixr:includeFile
    aliases:
    - includeFile

  code:
    range: CodeType
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:code

  default:
    range: string
    slot_uri: fixr:default

  union_data_type:
    range: UnionDataType
    slot_uri: fixr:unionDataType
    aliases:
    - unionDataType

  sort:
    range: integer
