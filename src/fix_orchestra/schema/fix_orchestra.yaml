    slot_uri: fixr:sort

  block_assignment:
    range: BlockAssignmentType
    description: Specifies a how a component or each group entry is populated (optional)
    multivalued: true
    inlined: true
    inlined_as_list: true
    slot_uri: fixr:blockAssignment
    aliases:
    - blockAssignment

  when:
    range: ExpressionType
    slot_uri: fixr:when
