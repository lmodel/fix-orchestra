          Rules that make the element's presence or limits depend on other values.
        range: OrchestraFieldRuleV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: rule
      fixr_assign:
        description: An expression that sets the field's value.
        range: string
        pattern: ^[\s\S]{0,1024}$
        annotations:
          xml_element: assign
      fixr_encodings:
        description: >-
          More information that particular encodings need about the element.
        range: OrchestraEncodingsV11
        inlined: true
        annotations:
