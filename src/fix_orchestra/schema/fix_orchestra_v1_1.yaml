        annotations:
          xml_attribute: xml:base

  OrchestraEncodingV11:
    title: Orchestra interface encoding (1.1-rc3)
    description: >-
      An encoding used on an interface or session, such as tag=value, FIXML or SBE.
    is_a: OrchestraProtocolV11
    annotations:
      xsd_type: encodingType
      xml_namespace: http://fixprotocol.io/2026/orchestra/interfaces
    in_subset:
      - fixi

  OrchestraEncodingsV11:
    title: Orchestra encoding blocks (1.1-rc3)
    description: >-
      The encoding blocks of one element, one for each encoding standard that needs
