      fixr_name:
        description: The rule's name.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
      fixr_presence:
        description: The presence that applies while the rule's condition holds.
        range: OrchestraPresence
        annotations:
          xml_attribute: presence

  OrchestraComponentV11:
    title: Orchestra component (1.1-rc3)
    description: >-
      A named block of fields, groups and components that messages and other blocks
      include by reference.
    mixins:
      - OrchestraPedigreeV11Mixin
      - OrchestraIdentityV11Mixin
      - OrchestraScenarioReferenceV11Mixin
    annotations:
      xsd_type: componentType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_members:
        description: >-
          The fields, groups and components the component holds, in order.
        range: OrchestraStructureMemberV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_choice: componentRef groupRef fieldRef
      fixr_encodings:
        description: >-
          More information that particular encodings need about the element.
        range: OrchestraEncodingsV11
        inlined: true
        annotations:
          xml_element: encodings
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_category:
        description: The category the component belongs to, by name.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: category
      fixr_rendering:
        description: >-
          A hint for how a tool shows or reads the element, which no validator checks.
        range: string
        annotations:
          xml_attribute: rendering
      fixr_which:
        description: >-
          Whether one member exactly, or one or more members, must appear.
        range: OrchestraMemberSelection
        annotations:
          xml_attribute: which

  OrchestraComponentsV11:
    title: Orchestra components (1.1-rc3)
    description: The components a repository defines.
    annotations:
      xsd_type: components
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_component:
        description: The components.
        range: OrchestraComponentV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: component
      fixr_encodings:
        description: >-
          More information that particular encodings need about the element.
        range: OrchestraEncodingsV11
        inlined: true
        annotations:
          xml_element: encodings
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      xml_base:
        description: >-
          The base address for the list's relative links, which XInclude uses.
        range: uri
        annotations:
          xml_attribute: xml:base

  OrchestraConceptMemberV11:
    title: Orchestra concept item (1.1-rc3)
    description: >-
      One element a concept ties together, named by reference, which is a message,
      field, component or group. It holds exactly one of these.
    annotations:
      xsd_type: choice of componentRef, groupRef, fieldRef, messageRef
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    exactly_one_of:
      - slot_conditions:
          fixr_component_ref:
            required: true
      - slot_conditions:
          fixr_group_ref:
            required: true
      - slot_conditions:
          fixr_field_ref:
            required: true
      - slot_conditions:
          fixr_message_ref:
            required: true
    attributes:
      fixr_component_ref:
        description: A component used by reference.
        range: OrchestraComponentRefV11
        inlined: true
        annotations:
          xml_element: componentRef
      fixr_group_ref:
        description: A group used by reference.
        range: OrchestraGroupRefV11
        inlined: true
        annotations:
          xml_element: groupRef
      fixr_field_ref:
        description: A field used by reference.
        range: OrchestraFieldRefV11
        inlined: true
        annotations:
          xml_element: fieldRef
      fixr_message_ref:
        description: A message, by reference.
        range: OrchestraMessageRefV11
        inlined: true
        annotations:
          xml_element: messageRef

  OrchestraConceptV11:
    title: Orchestra concept (1.1-rc3)
    description: >-
      A named business idea that ties together the fields, components, groups and
      messages that express it.
    annotations:
      xsd_type: conceptType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_members:
        description: >-
          The fields, components, groups and messages the concept ties together.
        range: OrchestraConceptMemberV11
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_choice: componentRef groupRef fieldRef messageRef
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The concept's name, unique among the repository's concepts.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name

  OrchestraConceptsV11:
    title: Orchestra concepts (1.1-rc3)
    description: The concepts a repository names.
    annotations:
      xsd_type: concepts
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_concept:
        description: The concepts.
        range: OrchestraConceptV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: concept
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      xml_base:
        description: >-
          The base address for the list's relative links, which XInclude uses.
        range: uri
        annotations:
          xml_attribute: xml:base

  OrchestraDatatypeV11:
    title: Orchestra datatype (1.1-rc3)
    description: >-
      A FIX datatype, such as Price or UTCTimestamp, with how it maps to the types
      of other standards.
    mixins:
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: datatype
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_mapped_datatype:
        description: How the datatype is written in other standards.
        range: OrchestraMappedDatatypeV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: mappedDatatype
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The datatype's name, such as Price.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
      fixr_base_type:
        description: The datatype this one narrows, such as int for Length.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: baseType

  OrchestraDatatypesV11:
    title: Orchestra datatypes (1.1-rc3)
    description: The datatypes a repository uses.
    annotations:
      xsd_type: datatypes
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_datatype:
        description: The datatypes.
        range: OrchestraDatatypeV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: datatype
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      xml_base:
        description: >-
          The base address for the list's relative links, which XInclude uses.
        range: uri
        annotations:
          xml_attribute: xml:base

  OrchestraDocumentationV11:
    title: Orchestra documentation (1.1-rc3)
    description: >-
      Text about an element, with its language, purpose and media type.
    mixins:
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: documentation
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_text:
        description: The text the element holds, as written.
        range: string
        annotations:
          xml_text: 'true'
      fixr_lang_id:
        description: The language of the text, as a language tag.
        range: string
        pattern: ^[A-Za-z]{1,8}(-[A-Za-z0-9]{1,8})*$
        annotations:
          xml_attribute: langId
      fixr_purpose:
        description: What the text is for, such as a summary or an example.
        any_of:
          - range: OrchestraPurposeV11
          - range: string
        annotations:
          xml_attribute: purpose
      fixr_content_type:
        description: The media type of the text; text/plain when none is given.
        range: string
        pattern: ^[\s\S]{3,}$
        ifabsent: string(text/plain)
        annotations:
          xml_attribute: contentType

  OrchestraEncodingStandardV11:
    title: Orchestra encoding standard (1.1-rc3)
    description: >-
      An encoding standard a repository uses, with a name to show and its general
