          xml_attribute: type
      fixr_code_set:
        description: The field's code set, by name.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: codeSet
      fixr_length_id:
        description: The tag number of the field that gives this field's length.
