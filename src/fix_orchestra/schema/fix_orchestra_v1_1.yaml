      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_length_id:
        description: The tag number of the field that gives this field's length.
        range: integer
        minimum_value: 1
        maximum_value: 2147483647
        annotations:
          xml_attribute: lengthId
      fixr_non_encoded_field_id:
        description: >-
          The tag number of the plain field that this encoded field stands for.
        range: integer
        minimum_value: 1
        maximum_value: 2147483647
        annotations:
          xml_attribute: nonEncodedFieldId
      fixr_instance_name:
        description: >-
          A name for this use of the element, so that one message or block can hold
          it more than once.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
