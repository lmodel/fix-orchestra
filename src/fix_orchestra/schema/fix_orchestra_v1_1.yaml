    attributes:
      fixr_unique:
        description: A check that the field's value is unique.
        range: OrchestraUniqueV11
        inlined: true
        annotations:
          xml_element: unique
      fixr_assign:
        description: >-
          Expressions that set or check values while the rule's condition holds.
        range: string
        multivalued: true
        pattern: ^[\s\S]{0,1024}$
        annotations:
          xml_element: assign
      fixr_when:
        description: When the rule applies, written as an expression.
        range: string
        required: true
        pattern: ^[\s\S]{0,1024}$
        annotations:
          xml_element: when
      fixr_name:
        description: The rule's name.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
      fixr_type:
