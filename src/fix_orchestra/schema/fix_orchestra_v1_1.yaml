    annotations:
      xsd_type: encodings
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_encoding:
        description: The encoding blocks, one per standard.
        range: OrchestraNamedEncodingV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: encoding

  OrchestraFieldConstraintsV11Mixin:
    title: Orchestra field limits (1.1-rc3)
    description: >-
      The limits on a field's value that a field, a use of it or a rule may set: range,
      length, presence, fixed or default value, character set and a display hint.
    mixin: true
    annotations:
      xsd_type: fieldAttribGrp
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_min_inclusive:
        description: The smallest value allowed.
        range: string
        annotations:
          xml_attribute: minInclusive
      fixr_max_inclusive:
        description: The largest value allowed.
        range: string
        annotations:
          xml_attribute: maxInclusive
      fixr_impl_length:
        description: The fixed length an implementation uses.
        range: integer
        minimum_value: -32768
        maximum_value: 32767
        annotations:
          xml_attribute: implLength
      fixr_impl_min_length:
        description: The shortest length an implementation accepts.
        range: integer
        minimum_value: -32768
        maximum_value: 32767
        annotations:
          xml_attribute: implMinLength
      fixr_impl_max_length:
        description: The longest length an implementation accepts.
        range: integer
        minimum_value: -32768
        maximum_value: 32767
        annotations:
          xml_attribute: implMaxLength
      fixr_presence:
        description: >-
          Whether the item must, may or must not appear, or has a fixed value; optional
          when none is given.
        range: OrchestraPresence
        ifabsent: OrchestraPresence(optional)
        annotations:
          xml_attribute: presence
      fixr_encoding:
        description: The character set of the value, when it is not US-ASCII.
        range: string
        annotations:
          xml_attribute: encoding
      fixr_value:
        description: >-
          The value a receiver assumes when an optional field is left out, or the
          fixed value of a constant field.
        range: string
        annotations:
          xml_attribute: value
      fixr_rendering:
        description: >-
          A hint for how a tool shows or reads the element, which no validator checks.
        range: string
        annotations:
          xml_attribute: rendering

  OrchestraFieldRefV11:
    title: Orchestra field use (1.1-rc3)
