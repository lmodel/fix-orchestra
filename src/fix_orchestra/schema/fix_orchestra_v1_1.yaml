          it more than once.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: instanceName

  OrchestraComponentRuleV11:
    title: Orchestra component rule (1.1-rc3)
    description: >-
