    annotations:
      xsd_type: encodingStandard
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_encoding:
        description: Encoding details that hold for the whole standard.
        range: OrchestraUnnamedEncodingV11
        inlined: true
        annotations:
          xml_element: encoding
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The encoding standard's name, which encoding blocks use.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
      fixr_display_name:
        description: The standard's name as a reader sees it.
        range: string
        annotations:
          xml_attribute: displayName

  OrchestraEncodingStandardsV11:
    title: Orchestra encoding standards (1.1-rc3)
    description: >-
      The encoding standards that a repository's encoding blocks name.
    annotations:
      xsd_type: encodingStandards
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_encoding_standard:
        description: The encoding standards.
        range: OrchestraEncodingStandardV11
        multivalued: true
        inlined_as_list: true
