        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: type

  OrchestraFieldV11:
    title: Orchestra field (1.1-rc3)
    description: >-
      A FIX field: its tag number, its name, its datatype or its code set, and the
