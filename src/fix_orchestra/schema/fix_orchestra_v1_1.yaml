---
id: https://w3id.org/lmodel/fix-orchestra/fix_orchestra_v1_1
name: fix_orchestra_v1_1
title: FIX Orchestra v1.1 Release Candidate 3
description: >-
  Orchestra v1.1 Release Candidate 3 of June 2026, rendered from the XSDs that the
  fix-orchestra code repository tags v1.1-rc3. It adds scenarios, encoding standards
  and encoding blocks, drops some of v1.0's attributes and narrows others, so it is
  a module of its own.
version: 1.1-rc3
source: https://github.com/FIXTradingCommunity/fix-orchestra/tree/v1.1-rc3/repository/src/main/resources/xsd
license: Apache-2.0
see_also:
  - https://lmodel.github.io/fix-orchestra
  - https://github.com/FIXTradingCommunity/fix-orchestra-spec
annotations:
  upstream_repository: https://github.com/FIXTradingCommunity/fix-orchestra
  upstream_tag: v1.1-rc3
  upstream_commit: eb4bb9de3bd8802c6e5e0aba06182407b22acc9b
  xml_namespace_repository: http://fixprotocol.io/2026/orchestra/repository
  xml_namespace_interfaces: http://fixprotocol.io/2026/orchestra/interfaces

prefixes:
  fix_orchestra: https://w3id.org/lmodel/fix-orchestra/
  linkml: https://w3id.org/linkml/
  dc: http://purl.org/dc/elements/1.1/
  dcterms: http://purl.org/dc/terms/
default_prefix: fix_orchestra
default_range: string

imports:
  - linkml:types
  - ./fix_orchestra_common

enums:

  OrchestraPurposeV11:
    title: Orchestra text purpose (1.1-rc3)
    description: >-
      The kinds of purpose the standard names for a text or hint. A file may give
      another purpose of its own.
    permissible_values:
      SYNOPSIS:
        description: A short summary.
      ELABORATION:
        description: A longer explanation.
      EXAMPLE:
        description: An example of use.
      DISPLAY:
        description: A name to show to people in place of the element's own.
      CAPTION:
        description: A label for a table, a figure or a heading.
      TOOLTIP:
        description: A short hint shown when a pointer rests on the element.
      DEFINITION:
        description: A formal definition in one sentence.

classes:

  OrchestraActionParameterV11:
    title: Orchestra action input (1.1-rc3)
    description: >-
      One input to an action, which is a field, component or group, defined in place
      or named by reference. It holds exactly one of these.
    annotations:
      xsd_type: >-
        choice of field, fieldRef, component, componentRef, group, groupRef
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    exactly_one_of:
      - slot_conditions:
          fixr_field:
            required: true
      - slot_conditions:
          fixr_field_ref:
            required: true
      - slot_conditions:
          fixr_component:
            required: true
      - slot_conditions:
          fixr_component_ref:
            required: true
      - slot_conditions:
          fixr_group:
            required: true
      - slot_conditions:
          fixr_group_ref:
            required: true
    attributes:
      fixr_field:
        description: A field defined in place.
        range: OrchestraFieldV11
        inlined: true
        annotations:
          xml_element: field
      fixr_field_ref:
        description: A field used by reference.
        range: OrchestraFieldRefV11
        inlined: true
        annotations:
          xml_element: fieldRef
      fixr_component:
        description: A component defined in place.
        range: OrchestraComponentV11
        inlined: true
        annotations:
          xml_element: component
      fixr_component_ref:
        description: A component used by reference.
        range: OrchestraComponentRefV11
        inlined: true
        annotations:
          xml_element: componentRef
      fixr_group:
        description: A repeating group defined in place.
        range: OrchestraGroupV11
        inlined: true
        annotations:
          xml_element: group
      fixr_group_ref:
        description: A group used by reference.
        range: OrchestraGroupRefV11
        inlined: true
        annotations:
          xml_element: groupRef

  OrchestraActionStepV11:
    title: Orchestra action step (1.1-rc3)
    description: >-
      One thing an action does: send a message, set a value, fire a transition or
      schedule a timer. It holds exactly one of these.
    annotations:
      xsd_type: choice of messageRef, assign, trigger, timerSchedule
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    exactly_one_of:
      - slot_conditions:
          fixr_message_ref:
            required: true
      - slot_conditions:
          fixr_assign:
            required: true
      - slot_conditions:
          fixr_trigger:
            required: true
      - slot_conditions:
          fixr_timer_schedule:
            required: true
    attributes:
      fixr_message_ref:
        description: A message to send.
        range: OrchestraMessageRefV11
        inlined: true
        annotations:
          xml_element: messageRef
      fixr_assign:
        description: >-
          An expression that gives an actor's variable a value, such as $actor.variable=value.
        range: string
        pattern: ^[\s\S]{0,1024}$
        annotations:
          xml_element: assign
      fixr_trigger:
        description: A transition to fire.
        range: OrchestraTriggerV11
        inlined: true
        annotations:
          xml_element: trigger
      fixr_timer_schedule:
        description: A timer to start, stop or restart.
        range: OrchestraTimerScheduleV11
        inlined: true
        annotations:
          xml_element: timerSchedule

  OrchestraActionV11:
    title: Orchestra action (1.1-rc3)
    description: >-
      Things that happen together, such as when a response fires or a state is entered:
      messages sent, values set, transitions fired and timers scheduled, with their
      inputs.
    annotations:
      xsd_type: actionType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_parameters:
        description: >-
          The fields, groups and components the action takes as input, in order.
        range: OrchestraActionParameterV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_choice: field fieldRef component componentRef group groupRef
      fixr_actions:
        description: >-
          What the action does, in order: messages sent, values set, transitions fired
          and timers scheduled.
        range: OrchestraActionStepV11
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_choice: messageRef assign trigger timerSchedule

  OrchestraActorMemberV11:
    title: Orchestra actor item (1.1-rc3)
    description: >-
      One thing an actor keeps: a variable given as a field, component or group, a
      state machine or a timer. It holds exactly one of these.
    annotations:
      xsd_type: >-
        choice of field, fieldRef, component, componentRef, group, groupRef, states,
        timer
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    exactly_one_of:
      - slot_conditions:
          fixr_field:
            required: true
      - slot_conditions:
          fixr_field_ref:
            required: true
      - slot_conditions:
          fixr_component:
            required: true
      - slot_conditions:
          fixr_component_ref:
            required: true
      - slot_conditions:
          fixr_group:
            required: true
      - slot_conditions:
          fixr_group_ref:
            required: true
      - slot_conditions:
          fixr_states:
            required: true
      - slot_conditions:
          fixr_timer:
            required: true
    attributes:
      fixr_field:
        description: A variable defined in place as a field.
        range: OrchestraFieldV11
        inlined: true
        annotations:
          xml_element: field
      fixr_field_ref:
        description: A variable that uses a field by its number.
        range: OrchestraFieldRefV11
        inlined: true
        annotations:
          xml_element: fieldRef
      fixr_component:
        description: A variable defined in place as a component.
        range: OrchestraComponentV11
        inlined: true
        annotations:
          xml_element: component
      fixr_component_ref:
        description: A variable that uses a component by its number.
        range: OrchestraComponentRefV11
        inlined: true
        annotations:
          xml_element: componentRef
      fixr_group:
        description: A variable defined in place as a repeating group.
        range: OrchestraGroupV11
        inlined: true
        annotations:
          xml_element: group
      fixr_group_ref:
        description: A variable that uses a repeating group by its number.
        range: OrchestraGroupRefV11
        inlined: true
        annotations:
          xml_element: groupRef
      fixr_states:
        description: A state machine.
        range: OrchestraStateMachineV11
        inlined: true
        annotations:
          xml_element: states
      fixr_timer:
        description: A timer.
        range: OrchestraTimerV11
        inlined: true
        annotations:
          xml_element: timer

  OrchestraActorV11:
    title: Orchestra actor (1.1-rc3)
    description: >-
      A kind of party in an exchange, such as a buy-side firm or a venue, with the
      state it keeps: its variables, state machines and timers.
    annotations:
      xsd_type: actorType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_members:
        description: The actor's variables, state machines and timers, in order.
        range: OrchestraActorMemberV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_choice: >-
            field fieldRef component componentRef group groupRef states timer
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The actor's name, unique among the repository's actors.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name

  OrchestraActorsMemberV11:
    title: Orchestra actor or flow (1.1-rc3)
    description: >-
      One entry of the actors list, an actor or a flow. It holds exactly one of these.
    annotations:
      xsd_type: choice of actor, flow
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    exactly_one_of:
      - slot_conditions:
          fixr_actor:
            required: true
      - slot_conditions:
          fixr_flow:
            required: true
    attributes:
      fixr_actor:
        description: An actor.
        range: OrchestraActorV11
        inlined: true
        annotations:
          xml_element: actor
      fixr_flow:
        description: A flow.
        range: OrchestraFlowV11
        inlined: true
        annotations:
          xml_element: flow

  OrchestraActorsV11:
    title: Orchestra actors and flows (1.1-rc3)
    description: >-
      The parties a repository describes and the one-way flows between them.
    annotations:
      xsd_type: actors
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_members:
        description: The actors and flows, in order.
        range: OrchestraActorsMemberV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_choice: actor flow
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      xml_base:
        description: >-
          The base address for the list's relative links, which XInclude uses.
        range: uri
        annotations:
          xml_attribute: xml:base

  OrchestraAnnotationMemberV11:
    title: Orchestra annotation part (1.1-rc3)
    description: >-
      One part of an annotation, a piece of text or a hint for software. It holds
      exactly one of these.
    annotations:
      xsd_type: choice of documentation, appinfo
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    exactly_one_of:
      - slot_conditions:
          fixr_documentation:
            required: true
      - slot_conditions:
          fixr_appinfo:
            required: true
    attributes:
      fixr_documentation:
        description: A piece of text.
        range: OrchestraDocumentationV11
        inlined: true
        annotations:
          xml_element: documentation
      fixr_appinfo:
        description: A hint for software.
        range: OrchestraAppinfoV11
        inlined: true
        annotations:
          xml_element: appinfo

  OrchestraAnnotationV11:
    title: Orchestra annotation (1.1-rc3)
    description: >-
      Notes for readers and hints for software, attached to an element.
    mixins:
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: annotation
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_members:
        description: The texts and hints, in order.
        range: OrchestraAnnotationMemberV11
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_choice: documentation appinfo

  OrchestraAppinfoV11:
    title: Orchestra application hint (1.1-rc3)
    description: >-
      A hint for a particular tool or encoding, such as how FIXML renders an element,
      held as text and open XML.
    mixins:
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: appinfo
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_text:
        description: The text the element holds, as written.
        range: string
        annotations:
          xml_text: 'true'
      fixr_any:
        description: Child elements from other namespaces, kept as written.
        range: OrchestraXmlElement
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_any: elements
      fixr_spec_url:
        description: The address of a document that describes the element.
        range: uri
        annotations:
          xml_attribute: specUrl
      fixr_lang_id:
        description: The language of the text, as a language tag.
        range: string
        pattern: ^[A-Za-z]{1,8}(-[A-Za-z0-9]{1,8})*$
        annotations:
          xml_attribute: langId
      fixr_purpose:
        description: What the hint is for, such as the encoding it concerns.
        any_of:
          - range: OrchestraPurposeV11
          - range: string
        annotations:
          xml_attribute: purpose
      fixr_other_attributes:
        description: Attributes from other namespaces, kept as written.
        range: OrchestraXmlAttribute
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_any: attributes

  OrchestraBaseEncodingV11:
    title: Orchestra encoding block (1.1-rc3)
    description: >-
      What every encoding block shares: notes, and XML in another namespace that says
      how an element is encoded.
    abstract: true
    annotations:
      xsd_type: baseEncoding
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_any:
        description: Child elements from other namespaces, kept as written.
        range: OrchestraXmlElement
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_any: elements

  OrchestraBaseInterfaceV11:
    title: Orchestra connection description (1.1-rc3)
    description: >-
      What an interface and a session share: the services, encodings and protocols
      of a connection, layer by layer.
    abstract: true
    annotations:
      xsd_type: baseInterfaceType
      xml_namespace: http://fixprotocol.io/2026/orchestra/interfaces
    in_subset:
      - fixi
    attributes:
      fixi_service:
        description: The application-level services offered.
        range: OrchestraServiceV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: service
      fixi_user_interface:
        description: The user interfaces offered.
        range: OrchestraUserInterfaceV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: userInterface
      fixi_encoding:
        description: The encodings used.
        range: OrchestraEncodingV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: encoding
      fixi_session_protocol:
        description: The session-level protocols used.
        range: OrchestraSessionProtocolV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: sessionProtocol
      fixi_protocol:
        description: Other protocols used.
        range: OrchestraProtocolV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: protocol
      fixi_transport:
        description: The transports used.
        range: OrchestraTransportV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: transport
      fixi_annotation:
        description: Notes for readers and hints for software.
        range: OrchestraInterfaceAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixi_name:
        description: The interface's or session's name, unique within the file.
        range: string
        required: true
        pattern: ^([^ \t\r\n]+( [^ \t\r\n]+)*)?$
        annotations:
          xml_attribute: name
      fixi_other_attributes:
        description: Attributes from other namespaces, kept as written.
        range: OrchestraXmlAttribute
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_any: attributes

  OrchestraBlockAssignmentV11:
    title: Orchestra block assignment (1.1-rc3)
    description: >-
      How every entry of a group, or a single use of a component, gets its values:
      the fields, groups and components it sets.
    annotations:
      xsd_type: blockAssignmentType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_members:
        description: >-
          The fields, groups and components the assignment sets, in order.
        range: OrchestraStructureMemberV11
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_choice: componentRef groupRef fieldRef

  OrchestraCategoriesV11:
    title: Orchestra categories (1.1-rc3)
    description: >-
      The categories a repository sorts its messages and fields into.
    annotations:
      xsd_type: categories
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_category:
        description: The categories.
        range: OrchestraCategoryV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: category
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      xml_base:
        description: >-
          The base address for the list's relative links, which XInclude uses.
        range: uri
        annotations:
          xml_attribute: xml:base

  OrchestraCategoryV11:
    title: Orchestra category (1.1-rc3)
    description: >-
      A business process grouping within a section, such as order handling or market
      data.
    mixins:
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: categoryType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_encodings:
        description: >-
          More information that particular encodings need about the element.
        range: OrchestraEncodingsV11
        inlined: true
        annotations:
          xml_element: encodings
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The category's name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
      fixr_section:
        description: The section the category belongs to, by name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: section

  OrchestraCodeSetV11:
    title: Orchestra code set (1.1-rc3)
    description: >-
      A named list of the values a field may take, each with a name of its own, over
      one underlying datatype.
    mixins:
      - OrchestraIdentityV11Mixin
      - OrchestraScenarioReferenceV11Mixin
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: codeSetType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_code:
        description: The set's codes, in order.
        range: OrchestraCodeV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: code
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_encodings:
        description: >-
          More information that particular encodings need about the element.
        range: OrchestraEncodingsV11
        inlined: true
        annotations:
          xml_element: encodings
      fixr_type:
        description: The set's datatype, by name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: type
      fixr_default:
        description: The code a receiver assumes when none is given.
        range: string
        annotations:
          xml_attribute: default
      fixr_spec_url:
        description: >-
          The address of the outside list, such as an ISO standard, that gives the
          codes.
        range: uri
        annotations:
          xml_attribute: specUrl
      fixr_union_data_type:
        description: >-
          A datatype whose values a field of this set may hold beside its codes, such
          as a range kept for user-defined values.
        range: string
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: unionDataType

  OrchestraCodeSetsV11:
    title: Orchestra code sets (1.1-rc3)
    description: The code sets a repository defines.
    annotations:
      xsd_type: codeSets
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_code_set:
        description: The code sets.
        range: OrchestraCodeSetV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: codeSet
      fixr_encodings:
        description: >-
          More information that particular encodings need about the element.
        range: OrchestraEncodingsV11
        inlined: true
        annotations:
          xml_element: encodings
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      xml_base:
        description: >-
          The base address for the list's relative links, which XInclude uses.
        range: uri
        annotations:
          xml_attribute: xml:base

  OrchestraCodeV11:
    title: Orchestra code (1.1-rc3)
    description: >-
      One permitted value of the set, with its name and what goes on the wire.
    mixins:
      - OrchestraIdentityV11Mixin
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: codeType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_value:
        description: The value that goes on the wire for this code.
        range: string
        required: true
        pattern: ^([^ \t\r\n]+( [^ \t\r\n]+)*)?$
        annotations:
          xml_attribute: value
      fixr_sort:
        description: A number that places the code when its set is shown.
        range: integer
        minimum_value: 0
        annotations:
          xml_attribute: sort
      fixr_group:
        description: >-
          A label that places the code with others when its set is shown.
        range: string
        annotations:
          xml_attribute: group

  OrchestraComponentRefV11:
    title: Orchestra component use (1.1-rc3)
    description: >-
      Where a message or block includes a component, by its number, with its presence
      and any rules that make it conditional.
    mixins:
      - OrchestraReferenceV11Mixin
      - OrchestraPedigreeV11Mixin
    annotations:
      xsd_type: componentRefType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
      - fixr
    attributes:
      fixr_block_assignment:
        description: >-
          How the component, or every entry of the group, gets its values.
        range: OrchestraBlockAssignmentV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: blockAssignment
      fixr_rule:
        description: >-
          Rules that make the component's presence depend on other values.
        range: OrchestraComponentRuleV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: rule
      fixr_encodings:
        description: >-
