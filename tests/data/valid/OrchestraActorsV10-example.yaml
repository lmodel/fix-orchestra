# From tests/data/xml/v1.0-repository.xml, which this project wrote for its tests.
fixr_members:
  - fixr_actor:
      fixr_name: Trader
      fixr_members:
        - fixr_field:
            fixr_id: 9001
            fixr_name: OrderLimit
            fixr_type: Qty
        - fixr_field_ref:
            fixr_id: 11
        - fixr_states:
            fixr_name: OrderState
            fixr_initial:
              fixr_name: New
              fixr_transition:
                - fixr_name: Fill
                  fixr_target: Filled
                  fixr_when: $Trader.OrderLimit > 0
              fixr_onentry:
                fixr_actions:
                  - fixr_assign: $Trader.OrderLimit=100
            fixr_state:
              - fixr_name: Filled
                fixr_activity:
                  fixr_actions:
                    - fixr_message_ref:
                        fixr_name: ExecutionReport
                        fixr_id: 9
                        fixr_msg_type: '8'
                fixr_onexit:
                  fixr_actions:
                    - fixr_trigger:
                        fixr_state_machine: OrderState
                        fixr_actor: Trader
                        fixr_name: Fill
        - fixr_timer:
            fixr_name: Expiry
      fixr_annotation:
        fixr_members:
          - fixr_documentation:
              fixr_text: The firm that sends orders.
  - fixr_actor:
      fixr_name: Venue
      fixr_members:
        - fixr_component:
            fixr_id: 9100
            fixr_name: VenueState
            fixr_members:
              - fixr_field_ref:
                  fixr_id: 37
        - fixr_component_ref:
            fixr_id: 1012
        - fixr_group:
            fixr_id: 9200
            fixr_name: VenueGrp
            fixr_members:
              - fixr_field_ref:
                  fixr_id: 448
                  fixr_scenario: Equity
        - fixr_group_ref:
            fixr_id: 1013
  - fixr_flow:
      fixr_name: OrderFlow
      fixr_source: Trader
      fixr_destination: Venue
      fixr_reliability: recoverable
      fixr_annotation:
        fixr_members:
          - fixr_documentation:
              fixr_text: Orders from the firm to the venue.
