# From tests/data/xml/v1.0-interfaces.xml, which this project wrote for its tests.
fixi_metadata:
  dcterms_title:
    - Example venue interfaces
  dcterms_subject:
    - Order entry sessions
fixi_interface:
  - fixi_name: OrderEntry
    fixi_other_attributes:
      - xml_name: region
        xml_value: EU
    fixi_service:
      - fixi_name: OrderRouting
        fixi_version: '1.0'
        fixi_layer: application
        fixi_reliability: recoverable
        fixi_orchestration: https://example.org/venue/roe.xml
        fixi_annotation:
          fixi_members:
            - fixi_documentation:
                fixi_purpose: SYNOPSIS
                fixi_lang_id: en
                fixi_content_type: text/plain
                fixi_text: Order routing.
    fixi_user_interface:
      - fixi_name: TradingScreen
        fixi_layer: application
    fixi_encoding:
      - fixi_name: tagvalue
        fixi_version: FIX.Latest
        fixi_layer: presentation
    fixi_session_protocol:
      - fixi_name: FIXT
        fixi_version: '1.1'
        fixi_layer: session
        fixi_reliability: recoverable
    fixi_protocol:
      - fixi_name: SOFH
        fixi_layer: presentation
        fixi_other_attributes:
          - xml_name: '{https://example.org/orchestra-test}framing'
            xml_value: '2'
    fixi_transport:
      - fixi_name: TCP
        fixi_layer: transport
        fixi_address: 192.0.2.10:9001
        fixi_message_cast: unicast
        fixi_use: primary
    fixi_annotation:
      fixi_members:
        - fixi_documentation:
            fixi_text: The venue's order entry service.
            fixi_any:
              - xml_name: '{https://example.org/orchestra-test}aside'
                xml_text: in place
        - fixi_appinfo:
            fixi_purpose: monitoring
            fixi_spec_url: https://example.org/venue/status
            fixi_lang_id: en
            fixi_other_attributes:
              - xml_name: '{https://example.org/orchestra-test}level'
                xml_value: '2'
            fixi_text: 'status page '
            fixi_any:
              - xml_name: '{https://example.org/orchestra-test}link'
                xml_attributes:
                  - xml_name: href
                    xml_value: https://example.org/venue/status
    fixi_sessions:
      fixi_session:
        - fixi_name: FIRM1-VENUE
          fixi_service:
            - fixi_name: OrderRouting
          fixi_user_interface:
            - fixi_name: TradingScreen
          fixi_encoding:
            - fixi_name: tagvalue
          fixi_session_protocol:
            - fixi_name: FIXT
              fixi_version: '1.1'
          fixi_protocol:
            - fixi_name: SOFH
          fixi_transport:
            - fixi_name: TCP
              fixi_address: 192.0.2.10:9002
              fixi_message_cast: multicast
              fixi_use: secondary
          fixi_annotation:
            fixi_members:
              - fixi_documentation:
                  fixi_text: The firm's main session.
          fixi_identifier:
            - fixi_name: SenderCompID
              fixi_text: FIRM1
            - fixi_name: TargetCompID
              fixi_text: VENUE
          fixi_activation_time: '2026-01-05T08:00:00Z'
          fixi_deactivation_time: '2027-01-05T08:00:00Z'
          fixi_role: initiator
          fixi_security_keys: |-
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAexampleexampleexampleexampleexampleexample0=
            -----END PUBLIC KEY-----
