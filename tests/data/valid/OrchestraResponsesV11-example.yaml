# From tests/data/xml/v1.1-repository.xml, which this project wrote for its tests.
fixr_response:
  - fixr_name: Accept
    fixr_sync: pipelined
    fixr_parameters:
      - fixr_field_ref:
          fixr_id: 11
    fixr_actions:
      - fixr_message_ref:
          fixr_msg_type: '8'
          fixr_id: 9
          fixr_name: ExecutionReport
          fixr_impl_min_occurs: 1
          fixr_impl_max_occurs: unbounded
          fixr_identifiers:
            fixr_members:
              - fixr_correlate:
                  fixr_id: 11
                  fixr_name: ClOrdID
              - fixr_assign:
                  fixr_id: 37
                  fixr_source_id: 11
            fixr_annotation:
              fixr_members:
                - fixr_documentation:
                    fixr_text: The order is found by its ClOrdID.
      - fixr_assign: $Trader.OrderLimit=0
      - fixr_trigger:
          fixr_state_machine: OrderState
          fixr_actor: Trader
          fixr_name: Fill
      - fixr_timer_schedule:
          fixr_actor: Trader
          fixr_name: Expiry
          fixr_operation: RESET
          fixr_interval: PT30S
          fixr_activity:
            fixr_actions:
              - fixr_assign: $Trader.OrderLimit=0
    fixr_when: OrderQty > 0
